<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sethika POS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: blue top bar like S7POS; login gate; left cart + right catalog; tabs for stock, history, report, settings */
:root{
  --bg:#eaf0f8; --panel:#ffffff; --panel2:#f3f6fb; --fg:#1b2638; --muted:#5f6e88; --line:#d6dfec;
  --brand:#1e3a78; --brand-fg:#ffffff; --brand2:#2f64c4; --ok:#1c9a62; --warn:#d98314; --bad:#d3435b; --accent:#f08a24;
  --tile:#eef3fb; --shadow:0 1px 2px rgba(20,40,80,.08);
  --font:"Kantumruy Pro","Noto Sans Khmer","Khmer OS","Leelawadee UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1523; --panel:#17212f; --panel2:#1d293b; --fg:#e5ebf6; --muted:#93a0b8; --line:#2a3850;
  --brand:#12224a; --brand2:#4d86e0; --ok:#35c283; --warn:#f0a23a; --bad:#ef6a80; --accent:#f39a3c; --tile:#1d293b; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1523; --panel:#17212f; --panel2:#1d293b; --fg:#e5ebf6; --muted:#93a0b8; --line:#2a3850;
  --brand:#12224a; --brand2:#4d86e0; --ok:#35c283; --warn:#f0a23a; --bad:#ef6a80; --accent:#f39a3c; --tile:#1d293b; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{background:var(--brand);color:var(--brand-fg);display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.top .shop{font-weight:700;font-size:1.1rem;margin-right:auto;white-space:nowrap}
.chip{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
button.chip:hover{background:rgba(255,255,255,.24)}
.chip.o{background:var(--accent);color:#1b1200;font-weight:600}
.chip.g{background:rgba(53,194,131,.28)}.chip.w{background:rgba(240,162,58,.35)}.chip.r{background:var(--bad);font-weight:600}
.nav{display:flex;gap:4px;background:var(--brand);padding:0 12px 8px;overflow-x:auto}
.nav button{background:transparent;border:0;color:#cfdaf3;padding:8px 16px;border-radius:8px;font-weight:600;white-space:nowrap}
.nav button.on{background:var(--panel);color:var(--brand2)}
main{flex:1;min-height:0;overflow:auto}
.sale{display:grid;grid-template-columns:minmax(330px,440px) 1fr;gap:12px;padding:12px;height:100%;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.cartpane{display:flex;flex-direction:column;min-height:0;overflow:visible}
.row{display:flex;gap:8px;align-items:center}
.cartpane .head{padding:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand2)}
.ib{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:38px;height:38px;flex:none;font-weight:700}
#cartbody{display:flex;flex-direction:column;flex:1;min-height:0}
.cartlist{flex:1;overflow:auto;min-height:120px}
table{border-collapse:collapse;width:100%}
th{background:var(--brand);color:#fff;font-weight:600;text-align:left;padding:8px 10px;position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.r{text-align:right}.c{text-align:center}
.num{font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--panel2);width:28px;height:30px;font-weight:700}
.qty input{border:0;border-radius:0;width:44px;text-align:center;padding:4px;height:30px}
.x{background:none;border:0;color:var(--bad);font-size:1.1rem;font-weight:700}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.totals{border-top:1px solid var(--line);padding:10px;display:grid;gap:4px}
.totals .l{display:flex;justify-content:space-between;color:var(--muted)}
.grand{background:var(--brand);color:#fff;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;font-size:1.35rem;font-weight:700;margin-top:6px}
.grand small{font-weight:500;opacity:.85;font-size:.8rem;display:block}
.acts{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;padding:10px}
.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:600;color:#fff;background:var(--brand2)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn);color:#1a1200}
.btn.gh{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.big{padding:14px;font-size:1.05rem;grid-row:span 2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.scanwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--panel);border:1px solid var(--brand2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:60vh;overflow:auto}
.si{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 10px;align-items:center}
.si.on,.si:hover{background:var(--tile)}
.si .sn{overflow-wrap:anywhere}.si .sb{grid-column:1;color:var(--muted);font-size:.8rem}
.si .sp{font-weight:700;color:var(--bad);grid-row:1;grid-column:2}.si .ss{grid-row:1;grid-column:3;font-size:.8rem;background:var(--panel2);border-radius:20px;padding:0 8px}
.si .ss.l{background:var(--warn);color:#1a1200}.si .ss.o{background:var(--bad);color:#fff}
.catalog{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cats{display:flex;gap:8px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.cat{flex:none;border:1px solid var(--line);background:var(--tile);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.cat.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;align-content:start}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;position:relative}
.tile:hover{border-color:var(--brand2);background:var(--tile)}
.tile .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.25rem;color:#fff}
.tile .nm{font-size:.86rem;line-height:1.3;min-height:2.2em;overflow-wrap:anywhere}
.tile .pr{color:var(--bad);font-weight:700}
.tile .st{position:absolute;top:6px;right:6px;font-size:.7rem;background:var(--panel2);border-radius:20px;padding:1px 7px;color:var(--muted)}
.tile.low .st{background:var(--warn);color:#1a1200}
.tile.out{opacity:.55}
.more{grid-column:1/-1}
.page{padding:12px;display:grid;gap:12px;max-width:1200px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .grow{flex:1;min-width:180px}
.scroll{overflow-x:auto}
.pane h3{margin:0;padding:12px 12px 0;font-size:1.05rem}
.tag{display:inline-block;border-radius:20px;padding:1px 9px;font-size:.78rem;background:var(--panel2);color:var(--muted)}
.tag.low{background:var(--warn);color:#1a1200}.tag.out{background:var(--bad);color:#fff}.tag.ok{background:var(--ok);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{padding:12px}.kpi b{display:block;font-size:1.4rem}.kpi span{color:var(--muted);font-size:.85rem}
.ov{position:fixed;inset:0;background:rgba(8,14,28,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:12px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0;padding:14px 16px;font-size:1.1rem;background:var(--brand);color:#fff;border-radius:12px 12px 0 0}
.mb{padding:14px 16px;display:grid;gap:10px}
.mf{padding:0 16px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:.85rem;color:var(--muted);display:grid;gap:3px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pm button{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;font-weight:600}
.pm button.on{border-color:var(--ok);background:var(--tile)}
.big-n{font-size:1.8rem;font-weight:700;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16213a;color:#fff;padding:10px 18px;border-radius:30px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw}
.ell{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login{min-height:100%;display:grid;place-items:center;padding:16px;background:var(--bg)}
.lcard{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(20,40,80,.15)}
.lcard h1{margin:0;font-size:1.5rem;color:var(--brand2);text-align:center}
.lcard .sub{text-align:center;color:var(--muted);margin-top:-6px}
.lcard input{font-size:1.1rem;padding:12px}
.note{border-radius:8px;padding:8px 12px;background:var(--panel2);color:var(--muted);font-size:.85rem}
.note.w{background:rgba(217,131,20,.15);color:var(--fg)}
@media (max-width:860px){
  .sale{grid-template-columns:1fr;height:auto}
  .cartlist{max-height:300px}
  .catalog{min-height:420px}
  .top .shop{width:100%}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .12s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
</head>
<body>
<div class="app" id="app"><div class="login"><div class="lcard"><h1>Sethika POS</h1><div class="sub">កំពុងផ្ទុក...</div></div></div></div>
<div id="layer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round((n||0)*100)/100===Math.round(n||0)?Math.round(n||0).toLocaleString("en-US"):(Math.round((n||0)*100)/100).toLocaleString("en-US");
const money=n=>fmt(n)+"៛";
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>{d=new Date(d);return pad(d.getDate())+"-"+pad(d.getMonth()+1)+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
const dkey=d=>{d=new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const dk2=k=>k.split("-").reverse().join("-");
const tm=d=>{d=new Date(d);return pad(d.getHours())+":"+pad(d.getMinutes())};
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[^\d.\-]/g,""));return isNaN(n)?0:n};
const rid=()=>{const a=new Uint8Array(9),c="abcdefghijklmnopqrstuvwxyz0123456789";crypto.getRandomValues(a);return Array.from(a,x=>c[x%36]).join("")};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return "x"+h.toString(16)}}
const pinHash=(id,pin)=>sha("sethika|"+id+"|"+pin);
const MN={cash:"សាច់ប្រាក់",qr:"QR / ABA",card:"កាត"};
const COLORS=["#2f64c4","#1c9a62","#d98314","#8a4fc4","#d3435b","#0f8f9c","#6b7a2a","#c2569a"];

/* ================= local fallback store (same API as the shared db) ================= */
function LocalDB(key){
  let data={};try{data=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){data={}}
  const subs=new Set();let pt=0;
  const persist=()=>{clearTimeout(pt);pt=setTimeout(()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}},300)};
  const split=p=>{const i=p.lastIndexOf("/");return[p.slice(0,i),p.slice(i+1)]};
  const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const isO=v=>v&&typeof v==="object"&&!Array.isArray(v);
  const merge=(a,b)=>{for(const k in b){if(isO(b[k])&&isO(a[k]))merge(a[k],b[k]);else a[k]=clone(b[k])}return a};
  const meta={fromCache:false,hasPendingWrites:false};
  const sd=(id,d)=>({id,exists:d!==undefined,data:()=>d,metadata:meta});
  const cmp=(v,op,w)=>op==="=="?v===w:op==="!="?v!==w:op==="<"?v<w:op==="<="?v<=w:op===">"?v>w:op===">="?v>=w:false;
  function run(coll,q){
    let a=Object.entries(data[coll]||{});
    for(const f of q.f)a=a.filter(e=>cmp(e[1][f[0]],f[1],f[2]));
    if(q.o){const k=q.o[0],dir=q.o[1]==="desc"?-1:1;a.sort((x,y)=>{const u=x[1][k],v=y[1][k];return u===v?0:(u===undefined?1:v===undefined?-1:(u<v?-dir:dir))})}
    else a.sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0);
    if(q.l)a=a.slice(0,q.l);
    const docs=a.map(e=>sd(e[0],e[1]));
    return{docs,size:docs.length,empty:!docs.length,metadata:meta};
  }
  function notify(c,path){subs.forEach(s=>{if(s.doc?s.path===path:s.coll===c)Promise.resolve().then(()=>{if(subs.has(s))s.next(s.doc?sd(split(path)[1],(data[c]||{})[split(path)[1]]):run(s.coll,s.q))})})}
  function write(path,fn){const[c,id]=split(path);const cur=(data[c]||{})[id];const nv=fn(cur);if(nv===null){if(data[c])delete data[c][id]}else{(data[c]=data[c]||{})[id]=nv}persist();notify(c,path)}
  function Doc(path){const[c,id]=split(path);return{id,path,
    get:()=>Promise.resolve(sd(id,(data[c]||{})[id])),
    set:d=>{write(path,()=>clone(d));return Promise.resolve()},
    update:d=>{if((data[c]||{})[id]===undefined)return Promise.reject({code:"invalid_argument",message:"missing"});write(path,cur=>merge(clone(cur),d));return Promise.resolve()},
    delete:()=>{write(path,()=>null);return Promise.resolve()},
    onSnapshot:next=>{const s={doc:true,path,next};subs.add(s);Promise.resolve().then(()=>{if(subs.has(s))next(sd(id,(data[c]||{})[id]))});return()=>subs.delete(s)},
    collection:p=>Coll(path+"/"+p)}}
  function Q(coll,q){return{
    where:(f,op,v)=>Q(coll,{...q,f:[...q.f,[f,op,v]]}),
    orderBy:(f,d)=>Q(coll,{...q,o:[f,d||"asc"]}),
    limit:n=>Q(coll,{...q,l:n}),
    get:()=>Promise.resolve(run(coll,q)),
    onSnapshot:next=>{const s={doc:false,coll,q,next};subs.add(s);Promise.resolve().then(()=>{if(subs.has(s))next(run(coll,q))});return()=>subs.delete(s)}}}
  function Coll(path){return Object.assign(Q(path,{f:[],o:null,l:0}),{path,doc:id=>Doc(path+"/"+(id||rid())),add:d=>{const r=Doc(path+"/"+rid());return r.set(d).then(()=>r)}})}
  return{doc:Doc,collection:Coll};
}

/* ================= state ================= */
const DEF={shop:"Sethika Mart",rate:4100,footer:"អរគុណសម្រាប់ការគាំទ្រ! សូមអញ្ជើញមកម្តងទៀត",neg:true,addr:"",phone:"",cats:[],print:{paper:"80",copies:1,auto:false,font:12}};
let DBN=null,MODE="local",DLN=null,CANW=null;
let CFG={...DEF,print:{...DEF.print}};
let PRODUCTS=[],PMAP=new Map(),BMAP=new Map(),CHUNKS=[],STOCKOV={};
let ACCTS=[],CUSTS=[],SHIFTS=[],DAYIDX=new Set(),TODAY={day:"",sales:[]},DAYC={};
let SES=null,view="sale";
let cart=[],disc=0,discType="amt",cust="",cat="*",gridN=60,sug=[],sugI=0,q="";
let stPage=0,stQ="",hd="",rep={p:"today",from:"",to:"",who:""},repBusy=0;
const P=()=>Object.assign({paper:"80",copies:1,auto:false,font:12},CFG.print||{});
const isAdmin=()=>SES&&SES.role==="admin";
const canNeg=()=>CFG.neg!==false;
const ck=id=>id[0];

/* ================= writes ================= */
const JOBS={pending:0,failed:[]};
const chain={};
const wq=(path,fn)=>{const p=(chain[path]||Promise.resolve()).catch(()=>{}).then(fn);chain[path]=p;return p};
async function tryW(fn){for(let i=0;i<3;i++){try{return await fn()}catch(e){const c=e&&e.code;if((c==="unavailable"||c==="resource_exhausted")&&i<2){await sleep(400*(i+1)+Math.random()*300);continue}throw e}}}
function upsert(path,partial){return wq(path,()=>tryW(async()=>{const ref=DBN.doc(path);try{await ref.update(partial)}catch(e){if(e&&e.code==="invalid_argument"){await ref.set(partial);try{await ref.update(partial)}catch(e2){}}else throw e}}))}
function setDoc(path,data){return wq(path,()=>tryW(()=>DBN.doc(path).set(data)))}
function delDoc(path){return wq(path,()=>tryW(()=>DBN.doc(path).delete()))}
function job(label,fn){JOBS.pending++;paintSync();return Promise.resolve().then(fn).then(()=>{JOBS.pending--;paintSync()},e=>{JOBS.pending--;JOBS.failed.push({label,fn});paintSync();console.error(label,e);toast("រក្សាទុកមិនបាន៖ "+label)})}
function syncChip(){
  if(JOBS.failed.length)return `<button class="chip r" onclick="POS.retry()">⚠ រក្សាទុកមិនបាន (${JOBS.failed.length}) ចុចព្យាយាមម្តងទៀត</button>`;
  if(JOBS.pending)return `<span class="chip w">⏳ កំពុងរក្សាទុក</span>`;
  return MODE==="shared"?`<span class="chip g" title="ទិន្នន័យចែករំលែករវាងឧបករណ៍ទាំងអស់">☁ ចែករំលែក</span>`:`<span class="chip w" title="ទិន្នន័យនៅក្នុងឧបករណ៍នេះតែប៉ុណ្ណោះ">💾 ឧបករណ៍នេះ</span>`}
function paintSync(){const e=$("#sync");if(e)e.innerHTML=syncChip()}

/* ================= products ================= */
function mk(id,p){const o={id,barcode:String(p.barcode||""),name:String(p.name),cat:p.cat||"",price:+p.price||0,cost:+p.cost||0,stock:+p.stock||0,min:p.min==null?5:+p.min};const ov=STOCKOV[id];if(ov&&Date.now()-ov.t<6000)o.stock=ov.v;o._n=o.name.toLowerCase();o._b=o.barcode.toLowerCase();return o}
function rebuildProducts(docs){
  const list=[];CHUNKS=[];
  for(const d of docs){CHUNKS.push(d.id);const items=(d.data()||{}).items||{};for(const id in items){const p=items[id];if(!p||p.del||!p.name)continue;list.push(mk(id,p))}}
  list.sort((a,b)=>a._n<b._n?-1:a._n>b._n?1:0);
  PRODUCTS=list;PMAP=new Map();BMAP=new Map();
  for(const p of list){PMAP.set(p.id,p);if(p.barcode&&!BMAP.has(p._b))BMAP.set(p._b,p)}
}
const clean=p=>({barcode:p.barcode,name:p.name,cat:p.cat,price:p.price,cost:p.cost,stock:p.stock,min:p.min});

function adjStock(id,delta){const p=PMAP.get(id);if(!p)return Promise.resolve();p.stock+=delta;STOCKOV[id]={v:p.stock,t:Date.now()};const v=p.stock;return upsert("pchunks/"+ck(id),{items:{[id]:{stock:v}}})}
function search(qs,limit){
  qs=qs.trim().toLowerCase();if(!qs)return[];
  const out=[];
  for(let i=0;i<PRODUCTS.length;i++){const p=PRODUCTS[i];let s=-1;
    if(p._b===qs)s=0;else if(p._b.startsWith(qs))s=1;else if(p._n.startsWith(qs))s=2;else if(p._n.includes(qs))s=3;else if(p._b.includes(qs))s=4;
    if(s>=0)out.push([s,p])}
  out.sort((a,b)=>a[0]-b[0]);
  return out.slice(0,limit).map(x=>x[1]);
}

/* ================= sales storage ================= */
function flat(docs,day){const a=[];for(const d of docs){const items=(d.data()||{}).items||{};for(const id in items){const s=items[id];if(s&&s.items)a.push({...s,id,day:s.day||day})}}a.sort((x,y)=>y.date-x.date);return a}
async function getDay(day,force){
  if(day===TODAY.day)return TODAY.sales;
  const c=DAYC[day];if(c&&!force&&Date.now()-c.t<60000)return c.sales;
  if(!DAYIDX.has(day)&&!force)return[];
  const snap=await DBN.collection("sales/"+day+"/h").get();
  const sales=flat(snap.docs,day);DAYC[day]={t:Date.now(),sales};return sales;
}
function putSale(s){
  return upsert(`sales/${s.day}/h/${s.hh}`,{items:{[s.id]:s}}).then(()=>{if(!DAYIDX.has(s.day)){DAYIDX.add(s.day);return setDoc("dayidx/"+s.day,{day:s.day})}});
}
function findSale(id){let s=TODAY.sales.find(x=>x.id===id);if(s)return s;for(const k in DAYC){s=DAYC[k].sales.find(x=>x.id===id);if(s)return s}return null}
async function salesInRange(f,t){
  const days=[...DAYIDX].filter(d=>d>=f&&d<=t);const td=TODAY.day;if(td>=f&&td<=t&&!days.includes(td))days.push(td);
  const arr=await Promise.all(days.map(d=>getDay(d)));
  return arr.flat();
}
async function shiftSales(sh){
  const days=[];const a=new Date(sh.open);a.setHours(0,0,0,0);const end=new Date(sh.close||Date.now());
  for(const d=new Date(a);d<=end;d.setDate(d.getDate()+1))days.push(dkey(d));
  const arr=await Promise.all(days.map(d=>getDay(d)));
  return arr.flat().filter(s=>s.shift===sh.id);
}
function stats(list){
  const r={n:0,total:0,disc:0,cost:0,cash:0,qr:0,card:0,items:{}};
  list.forEach(s=>{if(s.void)return;r.n++;r.total+=s.total;r.disc+=s.disc||0;r[s.method]=(r[s.method]||0)+s.total;
    s.items.forEach(i=>{r.cost+=i.cost*i.qty;const t=r.items[i.name]||(r.items[i.name]={q:0,r:0});t.q+=i.qty;t.r+=i.price*i.qty})});
  r.profit=r.total-r.cost;return r}

function sub(tag,ref,fn){return ref.onSnapshot(s=>{try{fn(s)}catch(e){console.error(tag,e)}mark(tag);refreshSoon()},e=>{console.error(tag,e);mark(tag)})}
function startSubs(){

  const t=cartTotal();pm="cash";
  modal("គិតលុយ",`<div style="text-align:center;color:var(--muted)">ទឹកប្រាក់ត្រូវបង់</div><div class="big-n num">${money(t)}</div><div style="text-align:center;color:var(--muted)">≈ $${(t/CFG.rate).toFixed(2)}</div>
   <div class="pm"><button class="on" id="pm-cash" onclick="POS.pm('cash')">សាច់ប្រាក់</button><button id="pm-qr" onclick="POS.pm('qr')">QR / ABA</button><button id="pm-card" onclick="POS.pm('card')">កាត</button></div>
   <label>ប្រាក់ទទួល (៛)<input id="rec" inputmode="numeric" value="${t}"></label>
   <div class="quick">${[t,5000,10000,20000,50000,100000].map((v,i)=>`<button onclick="POS.setRec(${v})">${i?fmt(v):"គ្រប់ចំនួន"}</button>`).join("")}</div>

   `<button class="btn gh" onclick="POS.close()">បោះបង់</button><button class="btn ok" id="okp" onclick="POS.finish()">បញ្ជាក់ការបង់ប្រាក់</button>`);
  const r=$("#rec");r.addEventListener("input",calc);r.addEventListener("keydown",e=>{if(e.key==="Enter")POS.finish()});r.focus();r.select();calc();
}
function calc(){const t=cartTotal(),r=parseFloat($("#rec").value)||0,c=r-t;const e=$("#chg");e.textContent=c>=0?money(c):"ខ្វះ "+money(-c);e.style.color=c>=0?"var(--ok)":"var(--bad)";$("#okp").disabled=c<0}
function finish(){
  const t=cartTotal(),r=parseFloat($("#rec").value)||0;if(r<t)return;
  const sh=curShift();if(!sh){closeM();POS.openShift(true);return}
  if(!canNeg())for(const i of cart){const p=PMAP.get(i.id);if(!p||p.stock<i.qty){toast("ស្តុកមិនគ្រប់សម្រាប់ "+i.name);return}}
  const now=new Date(),c=CUSTS.find(x=>x.id===cust);
  const sale={id:rid(),no:"INV-"+dkey(now).replace(/-/g,"")+"-"+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds())+Math.floor(Math.random()*10),
    date:now.getTime(),day:dkey(now),hh:pad(now.getHours()),shift:sh.id,cashier:SES.name,cashierId:SES.id,
    items:cart.map(i=>({id:i.id,barcode:i.barcode,name:i.name,price:i.price,cost:i.cost,qty:i.qty})),
    sub:cartSub(),disc:discAmt(),total:t,paid:r,change:r-t,method:pm,customer:c?c.name:"អតិថិជនទូទៅ"};
  TODAY.sales.unshift(sale);
  job("វិក្កយបត្រ "+sale.no,()=>putSale(sale));
  sale.items.forEach(i=>job("ស្តុក "+i.name,()=>adjStock(i.id,-i.qty)));
  cart=[];disc=0;cust="";
  paintTop();vSale();POS.receipt(sale.id,true);
  if(P().auto&&!embedded())POS.printSale(sale.id);
}

const DOCCSS=".doc{background:#fff;color:#111;line-height:1.45}.doc h1{font-size:1.25em;margin:0;text-align:center}.doc .c{text-align:center}.doc .pl{display:flex;justify-content:space-between;gap:8px}.doc .pl span{min-width:0;overflow-wrap:anywhere}.doc hr{border:0;border-top:1px dashed #555;margin:6px 0}.doc table{width:100%;border-collapse:collapse}.doc td,.doc th{padding:2px 0;text-align:left;vertical-align:top;background:none;color:#111;border:0;position:static}.doc .r{text-align:right}.doc b{font-weight:700}.doc .sm{font-size:.85em;color:#333}";
document.head.insertAdjacentHTML("beforeend","<style>"+DOCCSS+".mb .doc{padding:12px;border:1px dashed #999;border-radius:6px}</style>");
function printDoc(body,auto){
  const p=P(),w=p.paper,roll=w==="58"||w==="80",wd=w==="58"?"54mm":"76mm";
  return `<!doctype html><html><head><meta charset="utf-8"><title>Print</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap"><style>@page{size:${roll?w+"mm auto":w};margin:${roll?"2mm":"12mm"}}html,body{margin:0;background:#fff}body{font-family:"Kantumruy Pro","Noto Sans Khmer","Khmer OS",sans-serif;font-size:${p.font}px;width:${roll?wd:"auto"}}${DOCCSS}</style></head><body>${body}${auto?"<scr"+"ipt>addEventListener('load',function(){setTimeout(function(){print()},500)})</scr"+"ipt>":""}</body></html>`;
}
function printHelp(){modal("ការបោះពុម្ពមិនដំណើរការនៅទីនេះ",`<div>ទំព័រនេះកំពុងបើកក្នុង Claude ដែលហាមឃាត់ការបោះពុម្ពដោយផ្ទាល់។ សូមប្រើប៊ូតុង «ទាញយកវិក្កយបត្រ» ហើយបើកឯកសារក្នុង Chrome ដើម្បីបោះពុម្ព។</div>`,`<button class="btn ok" onclick="POS.close()">យល់ព្រម</button>`)}
function doPrint(body,copies){
  if(!embedded()){
    const old=document.getElementById("pf");if(old)old.remove();
    const f=document.createElement("iframe");f.id="pf";f.setAttribute("aria-hidden","true");f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";document.body.appendChild(f);
    const d=f.contentWindow.document;d.open();d.write(printDoc(body,false));d.close();
    const n=copies||Math.max(1,P().copies);
    for(let i=0;i<n;i++)setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast("បោះពុម្ពមិនបាន")}},600+i*1500);
    return;
  }
  let w=null;try{w=window.open("","_blank")}catch(e){}
  if(w&&w.document){w.document.open();w.document.write(printDoc(body,true));w.document.close();return}
  if(DLN){DLN.save({filename:"receipt.html",data:printDoc(body,true)}).catch(e=>{if(!e||e.code!=="declined")printHelp()});return}
  printHelp();
}

const ALIAS={barcode:["barcode","bar code","sku","item code","product code","code","បារកូដ","លេខកូដ","កូដ"],cost:["cost","purchase","buy","តម្លៃដើម","ថ្លៃដើម","ដើម"],price:["price","retail","selling","តម្លៃលក់","ថ្លៃលក់","តម្លៃ","ថ្លៃ"],min:["min","alert","reorder","អប្បបរមា","ជូនដំណឹង"],stock:["stock","qty","quantity","on hand","balance","ស្តុក","ចំនួន","សល់"],cat:["category","group","cat","ប្រភេទ","ក្រុម"],phone:["phone","tel","mobile","contact","ទូរស័ព្ទ","លេខទូរ"],name:["name","product","item","description","ឈ្មោះ","ទំនិញ","ផលិតផល"]};
const AUTO={prod:["barcode","cost","price","min","stock","cat","name"],cust:["phone","name"]};
let imp={type:"prod",rows:[],map:{}};
function autoMap(){const head=imp.rows[0].map(h=>String(h==null?"":h).toLowerCase().trim());const used=new Set(),m={};
  FIELDS[imp.type].forEach(f=>m[f[0]]=-1);
  AUTO[imp.type].forEach(f=>{const i=head.findIndex((h,k)=>!used.has(k)&&h&&ALIAS[f].some(a=>h.includes(a)));if(i>=0){m[f]=i;used.add(i)}});
  imp.map=m}
function parseText(t){t=t.replace(/^﻿/,"");const first=t.split(/\r?\n/)[0]||"";
  const d=first.includes("\t")?"\t":((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",");
  const rows=[];let row=[],cur="",q2=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q2){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q2=false}else cur+=c}
    else if(c==='"')q2=true;
    else if(c===d){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";rows.push(row);row=[]}
    else cur+=c}
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows}
function setRows(rows){
  rows=rows.filter(r=>r.some(c=>String(c==null?"":c).trim()!==""));
  if(rows.length<2){toast("ឯកសារគ្មានទិន្នន័យ (ត្រូវមានក្បាលតារាង និងយ៉ាងហោចណាស់ ១ ជួរ)");return}
  imp.type=($("#itype")||{}).value||"prod";imp.rows=rows;autoMap();impMap()}
function readFile(f){
  const n=f.name.toLowerCase(),r=new FileReader();
  if(/\.(html?|mhtml)$/.test(n)){
    r.onload=()=>{try{const doc=new DOMParser().parseFromString(String(r.result),"text/html");let best=[];
      doc.querySelectorAll("table").forEach(t=>{const rows=[...t.querySelectorAll("tr")].map(tr=>[...tr.children].filter(c=>/^(TD|TH)$/.test(c.tagName)).map(c=>c.textContent.replace(/\s+/g," ").trim())).filter(x=>x.length>1);if(rows.length>best.length)best=rows});
      if(best.length<2){toast("រកមិនឃើញតារាងទំនិញក្នុងឯកសារ HTML នេះទេ");return}
      setRows(best)}catch(e){toast("អានឯកសារមិនបាន")}};
    r.readAsText(f,"UTF-8");return}
  if(/\.(xlsx|xls)$/.test(n)){
    if(!window.XLSX){toast("មិនអាចអាន Excel បានទេ សូមបិទភ្ជាប់តារាងដោយផ្ទាល់");return}
    r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});let best=[];wb.SheetNames.forEach(s=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:false,defval:""});if(rows.length>best.length)best=rows});setRows(best)}catch(e){toast("អានឯកសារមិនបាន")}};

  r.onload=()=>{const u=new Uint8Array(r.result);let t,bad=false;

  r.readAsArrayBuffer(f);
}

function exportCSV(name,rows){
  const bom=String.fromCharCode(0xFEFF);
  const text=bom+rows.map(r=>r.map(c=>{const s=String(c==null?"":c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(",")).join("\r\n");
  if(DLN){DLN.save({filename:name,data:text}).catch(e=>{if(!e||e.code!=="declined")toast("ទាញយកមិនបាន")});return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){toast("ទាញយកមិនបាន")}
}

    SHIFTS.unshift(sh);const {id,...d}=sh;job("វេន",()=>setDoc("shifts/"+id,d));
    closeM();paintTop();if(view==="sale")vSale();toast("បានបើកវេន #"+n)},
  async closeShift(){const c=curShift();if(!c)return;
    const sales=await shiftSales(c),st=stats(sales),exp=c.openCash+st.cash;
    modal("បិទវេន #"+c.no,`<div style="display:grid;gap:4px">
      ${[["បើកវេនម៉ោង",dstr(c.open)],["វិក្កយបត្រ",st.n],["សាច់ប្រាក់",money(st.cash)],["QR / ABA",money(st.qr)],["កាត",money(st.card)],["សរុបលក់",money(st.total)],["ប្រាក់ដើម",money(c.openCash)],["ប្រាក់សាច់ត្រូវមានក្នុងថត",money(exp)]].map(x=>`<div class="row" style="justify-content:space-between"><span>${x[0]}</span><b class="num">${x[1]}</b></div>`).join("")}</div>
      <label>ប្រាក់ដែលរាប់បានជាក់ស្តែង (៛)<input id="sc-c" inputmode="numeric" value="${exp}" oninput="POS.scDiff(${exp})"></label>
      <div class="row" style="justify-content:space-between"><span>ភាពខុសគ្នា</span><b id="sc-d" style="color:var(--ok)">0៛</b></div>
      <label>កំណត់ចំណាំ<input id="sc-n"></label>`,
      `<button class="btn gh" onclick="POS.close()">បោះបង់</button><button class="btn bad" onclick="POS.closeGo()">បិទវេន</button>`);
    const e=$("#sc-c");if(e){e.focus();e.select()}},
  scDiff(exp){const d=Math.round(num($("#sc-c").value))-exp,e=$("#sc-d");e.textContent=(d>0?"+":"")+fmt(d)+"៛";e.style.color=d===0?"var(--ok)":d>0?"var(--warn)":"var(--bad)"},
  async closeGo(){const c=curShift();if(!c)return;
    const sales=await shiftSales(c),st=stats(sales),exp=c.openCash+st.cash,cnt=Math.round(num($("#sc-c").value));
    Object.assign(c,{close:Date.now(),closeCash:cnt,expected:exp,diff:cnt-exp,note:$("#sc-n").value.trim()});
    const {id,...d}=c;job("បិទវេន",()=>setDoc("shifts/"+id,d));
    paintTop();if(view==="sale")vSale();
    await POS.shiftReport(c.id);if(P().auto&&!embedded())POS.printShift(c.id)},
  async shiftReport(id){const sh=SHIFTS.find(x=>x.id===id);if(!sh)return;const sales=await shiftSales(sh);
    modal("របាយការណ៍វេន #"+sh.no,shiftHTML(sh,sales),`<button class="btn" onclick="POS.printShift('${sh.id}')">🖨 បោះពុម្ព</button><button class="btn ok" onclick="POS.close()">បិទ</button>`)},
  async printShift(id){const sh=SHIFTS.find(x=>x.id===id);if(!sh)return;doPrint(shiftHTML(sh,await shiftSales(sh)),1)},
  /* history/report */
  histD(v){hd=v==="y"?dkey(new Date(Date.now()-864e5)):v;vHist()},
  repP(p){rep={...rep,p,from:"",to:""};vReport()},
  repC(){const f=$("#rf").value,t=$("#rt").value;if(!f){toast("សូមជ្រើសថ្ងៃចាប់ផ្តើម");return}rep={...rep,p:"custom",from:f,to:t||f};vReport()},
  repDay(k){rep={...rep,p:"custom",from:k,to:k};vReport()},
  repW(v){rep.who=v;vReport()},
  repPrint(){const r=repRange(),w=ACCTS.find(a=>a.id===rep.who);doPrint(reportHTML(r[0].startsWith("0000")?"ទាំងអស់":(r[0]===r[1]?dk2(r[0]):dk2(r[0])+" ដល់ "+dk2(r[1])),vReport.cur||[],w&&w.name),1)},
  repCSV(){const rows=[["លេខវិក្កយបត្រ","កាលបរិច្ឆេទ","អ្នកលក់","អតិថិជន","ទំនិញ","បង់តាម","បញ្ចុះតម្លៃ","សរុប","ស្ថានភាព"]];
    (vReport.cur||[]).forEach(s=>rows.push([s.no,dstr(s.date),s.cashier||"",s.customer,s.items.map(i=>i.name+" x"+i.qty).join("; "),MN[s.method]||"",s.disc||0,s.total,s.void?"លុបចោល":""]));
    exportCSV("sales-"+dkey(new Date())+".csv",rows)},
  /* stock */
  pg(d){stPage=Math.max(0,stPage+d);vStock()},
  exportP(){const rows=[["Barcode","Name","Category","Cost","Price","Stock","Min"]];PRODUCTS.forEach(p=>rows.push([p.barcode,p.name,p.cat,p.cost,p.price,p.stock,p.min]));exportCSV("products-"+dkey(new Date())+".csv",rows)},
  editP(id,bc){
    const p=id?PMAP.get(id):{barcode:bc||"",name:"",cat:CFG.cats[0]||"",price:"",cost:"",stock:0,min:5};if(!p)return;
    modal(id?"កែទំនិញ":"ទំនិញថ្មី",`<div class="f2"><label>បារកូដ<input id="pb" value="${esc(p.barcode)}"></label><label>ប្រភេទ<input id="pc" list="catl" value="${esc(p.cat)}"><datalist id="catl">${CFG.cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label></div>
      <label>ឈ្មោះទំនិញ<input id="pn" value="${esc(p.name)}"></label>
      <div class="f2"><label>តម្លៃដើម (៛)<input id="pcost" inputmode="numeric" value="${p.cost}"></label><label>តម្លៃលក់ (៛)<input id="ppr" inputmode="numeric" value="${p.price}"></label></div>
      <div class="f2"><label>ស្តុក<input id="pst" inputmode="decimal" value="${p.stock}"></label><label>ស្តុកអប្បបរមា (ជូនដំណឹង)<input id="pmn" inputmode="numeric" value="${p.min}"></label></div>`,
      `${id?`<button class="btn bad" onclick="POS.delP('${id}')">លុប</button>`:""}<button class="btn gh" onclick="POS.close()">បោះបង់</button><button class="btn ok" onclick="POS.saveP('${id||""}')">រក្សាទុក</button>`)},
  saveP(id){
    const n=$("#pn").value.trim(),b=$("#pb").value.trim(),pr=parseFloat($("#ppr").value),co=parseFloat($("#pcost").value)||0,c=$("#pc").value.trim();
    if(!n||!(pr>=0)){toast("សូមបញ្ចូលឈ្មោះ និង តម្លៃលក់");return}
    const dup=b&&BMAP.get(b.toLowerCase());if(dup&&dup.id!==id){toast("បារកូដនេះមានរួចហើយ");return}
    const o={id:id||rid(),barcode:b||String(Date.now()).slice(-9),name:n,cat:c,price:pr,cost:co,stock:parseFloat($("#pst").value)||0,min:parseFloat($("#pmn").value)||0};
    if(c&&!CFG.cats.includes(c)){CFG.cats=[...CFG.cats,c];const cats=CFG.cats;job("ប្រភេទ",()=>upsert("settings/main",{cats}))}
    saveProduct(o);closeM()},
  delP(id){if(!confirmed("d"+id))return;const p=PMAP.get(id);cart=cart.filter(i=>i.id!==id);job("លុបទំនិញ",()=>upsert("pchunks/"+ck(id),{items:{[id]:{del:true}}}));closeM()},
  stockIn(id){
    modal("បញ្ចូលស្តុក",`<label>ស្វែងរកទំនិញ (ឈ្មោះ ឬបារកូដ)<input id="si-q" autocomplete="off" placeholder="វាយដើម្បីស្វែងរក"></label><div id="si-l" class="scroll" style="max-height:200px"></div>
      <input type="hidden" id="si-id" value="${id||""}"><div id="si-n" style="font-weight:700">${id&&PMAP.get(id)?esc(PMAP.get(id).name):""}</div>
      <div class="f2"><label>ចំនួនបញ្ចូល (ដកចេញ ប្រើ −)<input id="sq2" inputmode="decimal" value="1"></label><label>តម្លៃដើមថ្មី (៛)<input id="sc" inputmode="numeric" value="${id&&PMAP.get(id)?PMAP.get(id).cost:""}"></label></div>
      <label>កំណត់ចំណាំ / អ្នកផ្គត់ផ្គង់<input id="sn"></label>`,`<button class="btn gh" onclick="POS.close()">បោះបង់</button><button class="btn ok" onclick="POS.saveIn()">បញ្ចូល</button>`);
    const qi=$("#si-q");qi.addEventListener("input",()=>{const r=search(qi.value,8);$("#si-l").innerHTML=r.map(p=>`<button class="si" onclick="POS.siPick('${p.id}')"><span class="sn">${esc(p.name)}</span><span class="sb">${esc(p.barcode)}</span><span class="ss">${stk(p.stock)}</span></button>`).join("")});
    (id?$("#sq2"):qi).focus()},
  siPick(id){const p=PMAP.get(id);if(!p)return;$("#si-id").value=id;$("#si-n").textContent=p.name;$("#sc").value=p.cost;$("#si-l").innerHTML="";$("#sq2").focus();$("#sq2").select()},
  saveIn(){const id=$("#si-id").value,p=PMAP.get(id),qn=parseFloat($("#sq2").value),c=parseFloat($("#sc").value)||0;
    if(!p){toast("សូមជ្រើសទំនិញ");return}if(!qn){toast("សូមបញ្ចូលចំនួន");return}if(p.stock+qn<0&&!canNeg()){toast("ស្តុកមិនអាចតិចជាងសូន្យ");return}
    const note=$("#sn").value.trim(),now=Date.now(),mk2=dkey(now).slice(0,7);
    p.stock+=qn;STOCKOV[id]={v:p.stock,t:now};const sv=p.stock;
    job("ស្តុក "+p.name,async()=>{await upsert("pchunks/"+ck(id),{items:{[id]:{stock:sv,...(qn>0&&c>0?{cost:c}:{})}}});await upsert("stockins/"+mk2,{items:{[rid()]:{date:now,pid:id,name:p.name,qty:qn,cost:c,note,by:SES.name}}})});
    closeM();setTimeout(()=>{if(view==="stock")vStock()},50);toast("បានបញ្ចូលស្តុក")},
  cats(){modal("ប្រភេទទំនិញ",`<div>${CFG.cats.map((c,i)=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${esc(c)}</span><button class="x" onclick="POS.delCat(${i})">✕</button></div>`).join("")||`<div class="empty">មិនទាន់មានប្រភេទ</div>`}</div>
    <div class="row"><input id="nc" placeholder="ឈ្មោះប្រភេទថ្មី"><button class="btn ok" onclick="POS.addCat()">បន្ថែម</button></div>`,`<button class="btn gh" onclick="POS.close()">បិទ</button>`)},
  addCat(){const v=$("#nc").value.trim();if(!v||CFG.cats.includes(v))return;CFG.cats=[...CFG.cats,v];const cats=CFG.cats;job("ប្រភេទ",()=>upsert("settings/main",{cats}));POS.cats()},
  delCat(i){const c=CFG.cats[i];if(PRODUCTS.some(p=>p.cat===c)){toast("មានទំនិញក្នុងប្រភេទនេះ មិនអាចលុបបានទេ");return}CFG.cats=CFG.cats.filter((_,k)=>k!==i);const cats=CFG.cats;job("ប្រភេទ",()=>upsert("settings/main",{cats}));POS.cats()},
  delAll(){modal("លុបទំនិញទាំងអស់",`<div style="color:var(--bad);font-weight:600">សកម្មភាពនេះមិនអាចត្រឡប់វិញបានទេ។ ទំនិញទាំងអស់ ${PRODUCTS.length.toLocaleString("en-US")} មុខនឹងត្រូវលុប។</div>
    <label style="grid-auto-flow:column;justify-content:start;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="da-cat" checked style="width:auto">លុបប្រភេទទំនិញផងដែរ (${CFG.cats.length})</label>`,
    `<button class="btn gh" onclick="POS.close()">បោះបង់</button><button class="btn bad" onclick="POS.delAllGo()">លុបឥឡូវនេះ</button>`)},
  async delAllGo(){
    const wc=$("#da-cat").checked,ids=CHUNKS.slice();closeM();toast("កំពុងលុប...");
    cart=[];disc=0;
    await job("លុបទំនិញ",async()=>{for(const id of ids)await delDoc("pchunks/"+id);if(wc){CFG.cats=[];await upsert("settings/main",{cats:[]})}});
    PRODUCTS=[];PMAP=new Map();BMAP=new Map();CHUNKS=[];if(wc)CFG.cats=[];
    toast("បានលុបទំនិញទាំងអស់");draw();
  },
  /* settings & accounts */
  saveSet(){
    const d={shop:$("#s1").value.trim()||"Sethika Mart",addr:$("#sa").value.trim(),phone:$("#sp").value.trim(),rate:parseFloat($("#s2").value)||4100,footer:$("#s3").value,neg:$("#s4").value==="1",
      print:{paper:$("#p1").value,copies:Math.max(1,Math.min(5,parseInt($("#p2").value,10)||1)),font:Math.max(8,Math.min(24,parseInt($("#p3").value,10)||12)),auto:$("#p4").value==="1"}};
    Object.assign(CFG,d);job("ការកំណត់",()=>upsert("settings/main",d));paintTop();toast("បានរក្សាទុក")},
  acctUI(){modal("បង្កើតគណនីថ្មី",`<label>ឈ្មោះគណនី<input id="an"></label>
    <label>តួនាទី<select id="ar"><option value="cashier">អ្នកលក់ (លក់ + ប្រវត្តិរបស់ខ្លួន)</option><option value="admin">ម្ចាស់/អ្នកគ្រប់គ្រង (ទាំងអស់)</option></select></label>
    <label>លេខកូដ ៤-៨ ខ្ទង់<input id="ap" type="password" inputmode="numeric"></label>`,`<button class="btn gh" onclick="POS.close()">បោះបង់</button><button class="btn ok" onclick="POS.acctGo()">បង្កើត</button>`)},
  async acctGo(){const n=$("#an").value.trim(),pin=$("#ap").value,role=$("#ar").value;
    if(!n){toast("សូមបញ្ចូលឈ្មោះ");return}if(!/^\d{4,8}$/.test(pin)){toast("លេខកូដត្រូវមាន ៤ ដល់ ៨ ខ្ទង់");return}
    if(ACCTS.some(a=>(a.nameL||a.name.toLowerCase())===n.toLowerCase())){toast("ឈ្មោះនេះមានរួចហើយ");return}
    const id=rid(),acc={name:n,nameL:n.toLowerCase(),role,pin:await pinHash(id,pin),created:Date.now()};
    ACCTS.push({id,...acc});job("គណនី",()=>setDoc("accounts/"+id,acc));closeM();vSet();toast("បានបង្កើតគណនី")},
  pinUI(id){const a=ACCTS.find(x=>x.id===id);if(!a)return;modal("ប្តូរលេខកូដ "+a.name,`<label>លេខកូដថ្មី ៤-៨ ខ្ទង់<input id="np" type="password" inputmode="numeric"></label>`,`<button class="btn gh" onclick="POS.close()">បោះបង់</button><button class="btn ok" onclick="POS.pinGo('${id}')">រក្សាទុក</button>`)},
  async pinGo(id){const pin=$("#np").value;if(!/^\d{4,8}$/.test(pin)){toast("លេខកូដត្រូវមាន ៤ ដល់ ៨ ខ្ទង់");return}const h=await pinHash(id,pin);const a=ACCTS.find(x=>x.id===id);if(a)a.pin=h;job("លេខកូដ",()=>upsert("accounts/"+id,{pin:h}));closeM();toast("បានប្តូរលេខកូដ")},
  delAcct(id){const a=ACCTS.find(x=>x.id===id);if(!a)return;if(a.role==="admin"&&ACCTS.filter(x=>x.role==="admin").length<2){toast("មិនអាចលុបអ្នកគ្រប់គ្រងចុងក្រោយបានទេ");return}
    if(!confirmed("da"+id))return;ACCTS=ACCTS.filter(x=>x.id!==id);job("លុបគណនី",()=>delDoc("accounts/"+id));vSet()}
};
window.POS=POS;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#ov"))closeM();
  if(view==="sale"&&SES&&!$("#ov")&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const a=document.activeElement;if(!a||!/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){const s=$("#scan");if(s)s.focus()}}
  if(e.key==="F9"&&view==="sale"&&SES&&!$("#ov")){e.preventDefault();pay()}
});

/* ================= boot ================= */
function afterLoad(){if(booted)return;booted=true;clearTimeout(bootT);if(!SES)loginScreen()}
let bootT=0;
(async function boot(){
  let ns=null;
  try{if(window.claude&&claude.use)ns=await Promise.race([claude.use("db"),sleep(10000).then(()=>null)])}catch(e){}
  if(ns){DBN=ns;MODE="shared"}else{DBN=LocalDB("sethika_ldb_v2");MODE="local"}
  try{if(window.claude&&claude.use){DLN=await claude.use("downloads");const u=await claude.use("user");if(u)CANW=await u.can("data.write")}}catch(e){}
  bootT=setTimeout(afterLoad,10000);
  startSubs();
})();
})();
</script>
