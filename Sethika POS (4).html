<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sethika POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark-blue top bar like S7POS; left cart pane + right product catalog; tabs for stock, history, report, settings */
:root{
  --bg:#eaf0f8; --panel:#ffffff; --panel2:#f3f6fb; --fg:#1b2638; --muted:#5f6e88; --line:#d6dfec;
  --brand:#1e3a78; --brand-fg:#ffffff; --brand2:#2f64c4; --ok:#1c9a62; --warn:#d98314; --bad:#d3435b; --accent:#f08a24;
  --tile:#eef3fb; --shadow:0 1px 2px rgba(20,40,80,.08);
  --font:"Kantumruy Pro","Noto Sans Khmer","Khmer OS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1523; --panel:#17212f; --panel2:#1d293b; --fg:#e5ebf6; --muted:#93a0b8; --line:#2a3850;
  --brand:#12224a; --brand2:#4d86e0; --ok:#35c283; --warn:#f0a23a; --bad:#ef6a80; --accent:#f39a3c; --tile:#1d293b; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1523; --panel:#17212f; --panel2:#1d293b; --fg:#e5ebf6; --muted:#93a0b8; --line:#2a3850;
  --brand:#12224a; --brand2:#4d86e0; --ok:#35c283; --warn:#f0a23a; --bad:#ef6a80; --accent:#f39a3c; --tile:#1d293b; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
/* top bar */
.top{background:var(--brand);color:var(--brand-fg);display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.top .shop{font-weight:700;font-size:1.1rem;margin-right:auto;white-space:nowrap}
.chip{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.24)}
.chip.o{background:var(--accent);color:#1b1200;font-weight:600}
.nav{display:flex;gap:4px;background:var(--brand);padding:0 12px 8px;overflow-x:auto}
.nav button{background:transparent;border:0;color:#cfdaf3;padding:8px 16px;border-radius:8px;font-weight:600;white-space:nowrap}
.nav button.on{background:var(--panel);color:var(--brand2)}
main{flex:1;min-height:0;overflow:auto}
/* sale */
.sale{display:grid;grid-template-columns:minmax(330px,430px) 1fr;gap:12px;padding:12px;height:100%;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.cartpane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.row{display:flex;gap:8px;align-items:center}
.cartpane .head{padding:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--brand2)}
.ib{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:38px;height:38px;flex:none;font-weight:700}
.cartlist{flex:1;overflow:auto;min-height:120px}
table{border-collapse:collapse;width:100%}
th{background:var(--brand);color:#fff;font-weight:600;text-align:left;padding:8px 10px;position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.r{text-align:right}.c{text-align:center}
.num{font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--panel2);width:28px;height:30px;font-weight:700}
.qty input{border:0;border-radius:0;width:44px;text-align:center;padding:4px;height:30px}
.x{background:none;border:0;color:var(--bad);font-size:1.1rem;font-weight:700}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.totals{border-top:1px solid var(--line);padding:10px;display:grid;gap:4px}
.totals .l{display:flex;justify-content:space-between;color:var(--muted)}
.grand{background:var(--brand);color:#fff;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;font-size:1.35rem;font-weight:700;margin-top:6px}
.grand small{font-weight:500;opacity:.85;font-size:.8rem;display:block}
.acts{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;padding:10px}
.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:600;color:#fff;background:var(--brand2)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn);color:#1a1200}
.btn.gh{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.big{padding:14px;font-size:1.05rem;grid-row:span 2}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* catalog */
.catalog{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cats{display:flex;gap:8px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.cat{flex:none;border:1px solid var(--line);background:var(--tile);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.cat.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;align-content:start}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;position:relative}
.tile:hover{border-color:var(--brand2);background:var(--tile)}
.tile .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.25rem;color:#fff}
.tile .nm{font-size:.86rem;line-height:1.3;min-height:2.2em;overflow-wrap:anywhere}
.tile .pr{color:var(--bad);font-weight:700}
.tile .st{position:absolute;top:6px;right:6px;font-size:.7rem;background:var(--panel2);border-radius:20px;padding:1px 7px;color:var(--muted)}
.tile.low .st{background:var(--warn);color:#1a1200}
.tile.out{opacity:.5}
/* pages */
.page{padding:12px;display:grid;gap:12px;max-width:1200px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .grow{flex:1;min-width:180px}
.scroll{overflow-x:auto}
.pane h3{margin:0;padding:12px 12px 0;font-size:1.05rem}
.tag{display:inline-block;border-radius:20px;padding:1px 9px;font-size:.78rem;background:var(--panel2);color:var(--muted)}
.tag.low{background:var(--warn);color:#1a1200}.tag.out{background:var(--bad);color:#fff}.tag.ok{background:var(--ok);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{padding:12px}.kpi b{display:block;font-size:1.4rem}.kpi span{color:var(--muted);font-size:.85rem}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding:12px;overflow-x:auto}
.bars div{flex:1;min-width:26px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--brand2);border-radius:4px 4px 0 0;min-height:2px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,14,28,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:12px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0;padding:14px 16px;font-size:1.1rem;background:var(--brand);color:#fff;border-radius:12px 12px 0 0}
.mb{padding:14px 16px;display:grid;gap:10px}
.mf{padding:0 16px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:.85rem;color:var(--muted);display:grid;gap:3px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pm button{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;font-weight:600}
.pm button.on{border-color:var(--ok);background:var(--tile)}
.big-n{font-size:1.8rem;font-weight:700;text-align:center}
.receipt{font-family:ui-monospace,Menlo,Consolas,"Kantumruy Pro",monospace;font-size:.85rem;background:#fff;color:#111;border:1px dashed #999;padding:14px;white-space:pre-wrap;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16213a;color:#fff;padding:10px 18px;border-radius:30px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw}
@media (max-width:860px){
  .sale{grid-template-columns:1fr;height:auto}
  .cartpane{max-height:none}
  .cartlist{max-height:300px}
  .catalog{min-height:420px}
  .top .shop{width:100%}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .12s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>

<script>
(function(){
"use strict";
const KEY="sethika_pos_v1";
const COLORS=["#2f64c4","#1c9a62","#d98314","#8a4fc4","#d3435b","#0f8f9c","#6b7a2a","#c2569a"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n||0).toLocaleString("en-US");
const money=n=>fmt(n)+"៛";
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>{d=new Date(d);return pad(d.getDate())+"-"+pad(d.getMonth()+1)+"-"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
const dkey=d=>{d=new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- data (example products are marked as samples) ---------- */
function seed(){
  const P=(barcode,name,cat,price,cost,stock,min)=>({id:uid()+barcode,barcode,name,cat,price,cost,stock,min:min||5});
  return{
    shop:"Sethika Mart",rate:4100,footer:"អរគុណសម្រាប់ការគាំទ្រ! សូមអញ្ជើញមកម្តងទៀត",
    cats:["ភេសជ្ជៈ","គ្រឿងទេស","គ្រឿងសម្អាង","ទឹក និង ទឹកដោះគោ","សម្ភារៈប្រើប្រាស់","សម្ភារៈក្មេង"],
    products:[
      P("35593364","ទឹកក្រិកកោះកុង 366","ទឹក និង ទឹកដោះគោ",5000,3800,48,12),
      P("56574658","Tessa តូច","សម្ភារៈប្រើប្រាស់",2000,1500,60,12),
      P("1001","Coca-Cola កំប៉ុង","ភេសជ្ជៈ",2500,1900,72,24),
      P("1002","Pepsi កំប៉ុង","ភេសជ្ជៈ",2500,1900,60,24),
      P("1003","Fanta កំប៉ុង","ភេសជ្ជៈ",2500,1900,40,24),
      P("1004","ទឹកបរិសុទ្ធ 500ml","ទឹក និង ទឹកដោះគោ",1000,600,120,36),
      P("2001","មីហ៊ឹង KORENO Beef","គ្រឿងទេស",4000,3200,35,10),
      P("2002","មីហ៊ឹនកាក់ Buldak Carbonara","គ្រឿងទេស",5000,4000,22,10),
      P("2003","ម្សៅស៊ុប MELAMINE","គ្រឿងទេស",5000,3900,18,8),
      P("3001","សាប៊ូលាងមុខ GARNIER 100ml","គ្រឿងសម្អាង",13000,10200,14,5),
      P("3002","ប្រអប់ដាក់ក្រដាស +ឈើចាក់ធ្មេញ","សម្ភារៈប្រើប្រាស់",6000,4300,16,5),
      P("3003","ក្រែមលាបមុខ Glow Lovely 100g","គ្រឿងសម្អាង",8000,6000,9,5),
      P("4001","ក្រណាត់កាត់ Baby Girl","សម្ភារៈក្មេង",46000,36000,6,3),
      P("4002","ខោទឹកនោម Daddy Care XXL","សម្ភារៈក្មេង",43000,35000,10,4),
      P("4003","ខោទឹកនោម Coricori S","សម្ភារៈក្មេង",37000,29500,4,4),
      P("4004","ខោទឹកនោម Coricori M","សម្ភារៈក្មេង",37000,29500,0,4)
    ],
    sales:[],ins:[],held:[],customers:[{id:"c0",name:"អតិថិជនទូទៅ",phone:""}],seq:0,
    sample:true
  };
}
let S=load();
function load(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t);if(d&&d.products)return d}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let cart=[],disc=0,discType="amt",cust="c0",view="sale",cat="*",q="",sq="",rng="today",pm="cash";
const find=id=>S.products.find(p=>p.id===id);
const canNeg=()=>S.neg!==false;
const cartSub=()=>cart.reduce((a,i)=>a+i.price*i.qty,0);
const discAmt=()=>Math.min(cartSub(),discType==="pct"?Math.round(cartSub()*disc/100):disc);
const cartTotal=()=>cartSub()-discAmt();
const catColor=c=>COLORS[Math.max(0,S.cats.indexOf(c))%COLORS.length];

function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(title,body,foot){$("#layer").innerHTML=`<div class="ov" id="ov"><div class="modal" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="mb">${body}</div><div class="mf">${foot||""}</div></div></div>`;
  $("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeM()})}
function closeM(){$("#layer").innerHTML="";if(view==="sale"){const s=$("#scan");if(s)s.focus()}}

/* ---------- shell ---------- */
function shell(){
  const tabs=[["sale","ការលក់"],["stock","ស្តុក"],["history","ប្រវត្តិលក់"],["report","របាយការណ៍"],["set","ការកំណត់"]];
  $("#app").innerHTML=`
  <header class="top"><div class="shop">${esc(S.shop)}</div>
    <span class="chip" id="clock"></span>
    <button class="chip" onclick="POS.held()">រង់ចាំ (${S.held.length})</button>
    <button class="chip" onclick="POS.importUI()">⬆ នាំចូលពីកម្មវិធីចាស់</button>
    ${shiftChip()}
    <span class="chip">👤 អ្នកគិតលុយ</span></header>
  <nav class="nav">${tabs.map(t=>`<button class="${view===t[0]?"on":""}" onclick="POS.go('${t[0]}')">${t[1]}</button>`).join("")}</nav>
  <main id="main"></main>`;
  tick();draw();
}
function tick(){const c=$("#clock");if(c)c.textContent=dstr(new Date())}
setInterval(tick,20000);
function draw(){({sale:vSale,stock:vStock,history:vHist2,report:vReport2,set:vSet2})[view]()}

/* ---------- sale ---------- */
function vSale(){
  const list=S.products.filter(p=>(cat==="*"||p.cat===cat)&&(!q||(p.name+p.barcode).toLowerCase().includes(q.toLowerCase())));
  $("#main").innerHTML=`<div class="sale">
  <section class="pane cartpane">
    <div class="head">
      <div class="row"><select id="cust" onchange="POS.setCust(this.value)">${S.customers.map(c=>`<option value="${c.id}" ${c.id===cust?"selected":""}>${esc(c.name)}${c.phone?" · "+esc(c.phone):""}</option>`).join("")}</select>
        <button class="ib" title="បន្ថែមអតិថិជន" onclick="POS.newCust()">+</button></div>
      <input id="scan" placeholder="Scan បារកូដ / ស្វែងរកតាមឈ្មោះ ហើយចុច Enter" autocomplete="off" value="${esc(q)}">
    </div>
    <div class="cartlist">${cart.length?`<table><thead><tr><th>ទំនិញ</th><th class="r">តម្លៃ</th><th class="c">ចំនួន</th><th class="r">សរុប</th><th></th></tr></thead><tbody>
      ${cart.map((i,k)=>`<tr><td>${esc(i.name)}<div style="color:var(--muted);font-size:.78rem">${esc(i.barcode)}</div></td>
        <td class="r num">${fmt(i.price)}</td>
        <td class="c"><span class="qty"><button onclick="POS.qty(${k},-1)" aria-label="បន្ថយ">−</button><input value="${i.qty}" inputmode="numeric" onchange="POS.setQty(${k},this.value)" aria-label="ចំនួន"><button onclick="POS.qty(${k},1)" aria-label="បន្ថែម">+</button></span></td>
        <td class="r num">${fmt(i.price*i.qty)}</td><td><button class="x" onclick="POS.del(${k})" aria-label="លុប">✕</button></td></tr>`).join("")}
      </tbody></table>`:`<div class="empty">មិនទាន់មានទំនិញ<br>Scan បារកូដ ឬ ចុចលើទំនិញនៅខាងស្តាំ</div>`}</div>
    <div class="totals">
      <div class="l"><span>ទំនិញ</span><b class="num">${cart.length} (${cart.reduce((a,i)=>a+i.qty,0)})</b></div>
      <div class="l"><span>សរុបរង</span><b class="num">${money(cartSub())}</b></div>
      <div class="l"><span>បញ្ចុះតម្លៃ <button class="chip" style="background:var(--panel2);color:var(--fg);padding:1px 8px" onclick="POS.discount()">កែ</button></span><b class="num">−${money(discAmt())}</b></div>
      <div class="grand"><span>សរុប</span><span style="text-align:right">${money(cartTotal())}<small>≈ $${(cartTotal()/S.rate).toFixed(2)}</small></span></div>
    </div>
    <div class="acts">
      <button class="btn warn" onclick="POS.hold()" ${cart.length?"":"disabled"}>រង់ចាំ</button>
      <button class="btn bad" onclick="POS.clear()" ${cart.length?"":"disabled"}>បោះបង់</button>
      <button class="btn ok big" onclick="POS.pay()" ${cart.length?"":"disabled"}>គិតលុយ</button>
      <button class="btn gh" onclick="POS.go('history')" style="grid-column:span 2">វិក្កយបត្រចុងក្រោយ</button>
    </div>
  </section>
  <section class="pane catalog">
    <div class="cats"><button class="cat ${cat==="*"?"on":""}" onclick="POS.setCat('*')">ទាំងអស់</button>

  </section></div>`;
  const s=$("#scan");
  if(!curShift()){const hd0=document.querySelector(".cartpane .head");if(hd0)hd0.insertAdjacentHTML("afterbegin",`<button class="btn warn" onclick="POS.openShift()">⚠ មិនទាន់បើកវេន ចុចដើម្បីបើកវេនលក់</button>`)}

  s.addEventListener("keydown",e=>{if(e.key==="Enter"){clearTimeout(scanT);scanEnter()}});
  const cl=document.querySelector(".cartlist");if(cl)cl.scrollTop=cl.scrollHeight;
  if(matchMedia("(pointer:fine)").matches||window.innerWidth>860)s.focus();
}
function refreshGrid(){
  const g=document.querySelector(".grid");if(!g)return;
  const list=S.products.filter(p=>(cat==="*"||p.cat===cat)&&(!q||(p.name+p.barcode).toLowerCase().includes(q.toLowerCase())));
  g.innerHTML=list.length?list.map(p=>`<button class="tile ${p.stock<=0?"out":p.stock<=p.min?"low":""}" onclick="POS.add('${p.id}')"><span class="st">${p.stock}</span><span class="ic" style="background:${catColor(p.cat)}">${esc([...p.name][0]||"?")}</span><span class="nm">${esc(p.name)}</span><span class="pr num">${money(p.price)}</span></button>`).join(""):`<div class="empty" style="grid-column:1/-1">រកមិនឃើញទំនិញ</div>`;
}
let AC;
function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=ok?1100:300;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(ok?.07:.25))}catch(e){}}
function scanEnter(){
  const v=q.trim();if(!v)return;
  const lv=v.toLowerCase();
  let p=S.products.find(x=>x.barcode===v);
  if(!p){const m=S.products.filter(x=>x.name.toLowerCase().includes(lv));if(m.length===1)p=m[0];else if(m.length>1){toast("មាន "+m.length+" ទំនិញត្រូវគ្នា សូមជ្រើសពីបញ្ជីខាងស្តាំ");return}}
  if(!p){beep(false);q="";vSale();
    if(/^\d{4,}$/.test(v)){modal("រកមិនឃើញបារកូដ "+v,`<div>ទំនិញនេះមិនទាន់មានក្នុងប្រព័ន្ធទេ។ ចង់បន្ថែមវាឥឡូវនេះទេ?</div>`,`<button class="btn gh" onclick="POS.close()">បិទ</button><button class="btn ok" onclick="POS.editP(null,'${v}')">បន្ថែមទំនិញថ្មី</button>`)}
    else toast("រកមិនឃើញទំនិញ");
    return}
  q="";addToCart(p.id,true);
}
function addToCart(id,scan){
  const p=find(id);if(!p)return;
  const it=cart.find(i=>i.id===id);const have=it?it.qty:0;
  if(!canNeg()&&have+1>p.stock){beep(false);toast("ស្តុកមិនគ្រប់៖ នៅសល់ "+p.stock);if(scan){q="";vSale()}return}
  if(it)it.qty++;else cart.push({id:p.id,barcode:p.barcode,name:p.name,price:p.price,cost:p.cost,qty:1});
  beep(true);if(scan)toast("+ "+p.name+"  "+money(p.price));
  vSale();
}

/* ---------- report ---------- */
function inRange(d){const t=new Date(d),n=new Date();
  if(rng==="all")return true;
  if(rng==="today")return dkey(t)===dkey(n);
  const days=rng==="7"?7:30;return (n-t)/864e5<days}
function vReport(){
  const ss=S.sales.filter(s=>!s.void&&inRange(s.date));
  const rev=ss.reduce((a,s)=>a+s.total,0),prof=ss.reduce((a,s)=>a+s.total-s.items.reduce((b,i)=>b+i.cost*i.qty,0)-0,0);
  const top={};ss.forEach(s=>s.items.forEach(i=>{const t=top[i.name]||(top[i.name]={q:0,r:0});t.q+=i.qty;t.r+=i.price*i.qty}));
  const tl=Object.entries(top).sort((a,b)=>b[1].r-a[1].r).slice(0,10);
  const byDay={};ss.forEach(s=>{const k=dkey(s.date);byDay[k]=(byDay[k]||0)+s.total});
  const days=Object.keys(byDay).sort().slice(-14),mx=Math.max(1,...days.map(k=>byDay[k]));
  const meth={cash:0,qr:0,card:0};ss.forEach(s=>meth[s.method]=(meth[s.method]||0)+s.total);
  $("#main").innerHTML=`<div class="page">
  <div class="bar">${[["today","ថ្ងៃនេះ"],["7","៧ ថ្ងៃ"],["30","៣០ ថ្ងៃ"],["all","ទាំងអស់"]].map(r=>`<button class="btn ${rng===r[0]?"":"gh"}" onclick="POS.rng('${r[0]}')">${r[1]}</button>`).join("")}</div>
  <div class="kpis"><div class="pane kpi"><span>ចំណូលសរុប</span><b>${money(rev)}</b></div><div class="pane kpi"><span>ប្រាក់ចំណេញ</span><b style="color:var(--ok)">${money(prof)}</b></div>
   <div class="pane kpi"><span>ចំនួនវិក្កយបត្រ</span><b>${ss.length}</b></div><div class="pane kpi"><span>ជាមធ្យម / វិក្កយបត្រ</span><b>${money(ss.length?rev/ss.length:0)}</b></div></div>
  <div class="pane"><h3>ការលក់តាមថ្ងៃ</h3>${days.length?`<div class="bars">${days.map(k=>`<div title="${k}: ${money(byDay[k])}"><i style="height:${Math.max(2,byDay[k]/mx*100)}%"></i>${k.slice(5)}</div>`).join("")}</div>`:`<div class="empty">មិនទាន់មានទិន្នន័យ</div>`}</div>
  <div class="pane"><h3>បែងចែកតាមការបង់ប្រាក់</h3><div class="mb">សាច់ប្រាក់ <b class="num">${money(meth.cash)}</b> · QR / ABA <b class="num">${money(meth.qr)}</b> · កាត <b class="num">${money(meth.card)}</b></div></div>
  <div class="pane"><h3>ទំនិញលក់ដាច់ ១០ ជាប់ឆ្នាយ</h3><div class="scroll"><table><thead><tr><th>ទំនិញ</th><th class="r">ចំនួន</th><th class="r">ចំណូល</th></tr></thead><tbody>
  ${tl.map(t=>`<tr><td>${esc(t[0])}</td><td class="r num">${t[1].q}</td><td class="r num">${money(t[1].r)}</td></tr>`).join("")||`<tr><td colspan="3" class="empty">មិនទាន់មានទិន្នន័យ</td></tr>`}</tbody></table></div></div></div>`;
}

/* ---------- actions ---------- */
const POS={
  go(v){view=v;shell()},
  setCust(v){cust=v},
  setCat(i){cat=i==="*"?"*":S.cats[i];vSale()},
  add(id){addToCart(id)},
  qty(k,d){const it=cart[k],p=find(it.id);const n=it.qty+d;if(n<1){cart.splice(k,1)}else if(!canNeg()&&n>p.stock){toast("ស្តុកមិនគ្រប់៖ នៅសល់ "+p.stock)}else it.qty=n;vSale()},
  setQty(k,v){const it=cart[k],p=find(it.id);let n=parseInt(v,10);if(!(n>0))n=1;if(!canNeg()&&n>p.stock){toast("ស្តុកមិនគ្រប់៖ នៅសល់ "+p.stock);n=p.stock}it.qty=n;vSale()},
  del(k){cart.splice(k,1);vSale()},
  clear(){cart=[];disc=0;vSale()},
  hold(){if(!cart.length)return;S.held.push({id:uid(),date:Date.now(),cart,disc,discType,cust});cart=[];disc=0;save();shell();toast("បានទុករង់ចាំ")},

    modal("បញ្ជីរង់ចាំ",S.held.length?S.held.map(h=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>${dstr(h.date)} · ${h.cart.length} មុខ · <b class="num">${money(h.cart.reduce((a,i)=>a+i.price*i.qty,0))}</b></span><span><button class="btn ok" style="padding:4px 10px" onclick="POS.recall('${h.id}')">បើក</button> <button class="btn bad" style="padding:4px 10px" onclick="POS.dropHeld('${h.id}')">លុប</button></span></div>`).join(""):`<div class="empty">គ្មានការរង់ចាំ</div>`,`<button class="btn gh" onclick="POS.close()">បិទ</button>`)},
  recall(id){const h=S.held.find(x=>x.id===id);if(!h)return;if(cart.length){toast("សូមបោះបង់ ឬ គិតលុយកន្ត្រកបច្ចុប្បន្នជាមុន");return}
    cart=h.cart;disc=h.disc;discType=h.discType;cust=h.cust;S.held=S.held.filter(x=>x.id!==id);save();view="sale";closeM();shell()},
  dropHeld(id){S.held=S.held.filter(x=>x.id!==id);save();POS.held();shell()},
  close:closeM,

    modal("បញ្ចុះតម្លៃ",`<div class="f2"><label>ប្រភេទ<select id="dt"><option value="amt" ${discType==="amt"?"selected":""}>ចំនួនទឹកប្រាក់ (៛)</option><option value="pct" ${discType==="pct"?"selected":""}>ភាគរយ (%)</option></select></label>
      <label>តម្លៃ<input id="dv" inputmode="numeric" value="${disc}"></label></div>`,

  newCust(){modal("អតិថិជនថ្មី",`<label>ឈ្មោះ<input id="cn"></label><label>លេខទូរស័ព្ទ<input id="cp" inputmode="tel"></label>`,`<button class="btn gh" onclick="POS.close()">បោះបង់</button><button class="btn ok" onclick="POS.addCust()">រក្សាទុក</button>`)},

    modal("គិតលុយ",`<div style="text-align:center;color:var(--muted)">ទឹកប្រាក់ត្រូវបង់</div><div class="big-n num">${money(t)}</div><div style="text-align:center;color:var(--muted)">≈ $${(t/S.rate).toFixed(2)}</div>
     <div class="pm"><button class="on" id="pm-cash" onclick="POS.pm('cash')">សាច់ប្រាក់</button><button id="pm-qr" onclick="POS.pm('qr')">QR / ABA</button><button id="pm-card" onclick="POS.pm('card')">កាត</button></div>
     <label>ប្រាក់ទទួល (៛)<input id="rec" inputmode="numeric" value="${t}"></label>

function parseText(t){t=t.replace(/^﻿/,"");const first=t.split(/\r?\n/)[0]||"";

    else if(c==='"')q2=true;
    else if(c===d){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";rows.push(row);row=[]}

function readFile(f){
  const n=f.name.toLowerCase(),r=new FileReader();
  if(/\.(html?|mhtml)$/.test(n)){
    r.onload=()=>{try{const doc=new DOMParser().parseFromString(String(r.result),"text/html");let best=[];
      doc.querySelectorAll("table").forEach(t=>{const rows=[...t.querySelectorAll("tr")].map(tr=>[...tr.children].filter(c=>/^(TD|TH)$/.test(c.tagName)).map(c=>c.textContent.replace(/\s+/g," ").trim())).filter(x=>x.length>1);if(rows.length>best.length)best=rows});
      if(best.length<2){toast("រកមិនឃើញតារាងទំនិញក្នុងឯកសារ HTML នេះទេ");return}
      setRows(best)}catch(e){toast("អានឯកសារមិនបាន")}};
    r.readAsText(f,"UTF-8");return}
  if(/\.(xlsx|xls)$/.test(n)){

    r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});let best=[];wb.SheetNames.forEach(s=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:false,defval:""});if(rows.length>best.length)best=rows});setRows(best)}catch(e){toast("អានឯកសារមិនបាន")}};
    r.readAsArrayBuffer(f);
  }else{r.onload=()=>{const u=new Uint8Array(r.result);let t,bad=false;
      if((u[0]===0x50&&u[1]===0x4B)||u.slice(0,2000).includes(0)){toast("នេះជាឯកសារ ZIP ឬឯកសារទ្រង់ទ្រាយផ្សេង មិនមែនតារាងទេ សូមជ្រើសឯកសារ .html ឬ .xlsx ឬបិទភ្ជាប់ដោយដោយត្រង់");return}
      if(u[0]===0xFF&&u[1]===0xFE)t=new TextDecoder("utf-16le").decode(u);
      else if(u[0]===0xFE&&u[1]===0xFF)t=new TextDecoder("utf-16be").decode(u);
      else{try{t=new TextDecoder("utf-8",{fatal:true}).decode(u)}catch(e){t=new TextDecoder("utf-8").decode(u);bad=true}}
      if(bad)toast("ឯកសារមិនមែន UTF-8 អក្សរខ្មែរអាចខូច សូមបិទភ្ជាប់ដោយដោយត្រង់ ឬរក្សាទុកជា .xlsx");
      setRows(parseText(t))};r.readAsArrayBuffer(f)}
}

POS.impGo=function(){
  const m=curMap();if(m.name<0){toast("សូមជ្រើសជួរឈ្មោះ");return}
  const body=imp.rows.slice(1);
  const g=(r,k)=>m[k]>=0?String(r[m[k]]==null?"":r[m[k]]).trim():"";
  let a=0,u=0,s=0,b=0;
  if(imp.type==="cust"){
    body.forEach((r,i)=>{const n=g(r,"name");if(!n){b++;return}const ph=g(r,"phone");if(S.customers.some(c=>c.name===n&&c.phone===ph)){s++;return}S.customers.push({id:uid()+i,name:n,phone:ph});a++});
  }else{
    const mult=$("#icur").value==="usd"?S.rate:1,mode=$("#imode").value,stk=$("#istk").value,clr=$("#iclr");
    if(clr&&clr.checked){S.products=[];S.ins=[];S.held=[];S.cats=[];cart=[];disc=0}
    body.forEach((r,i)=>{
      const n=g(r,"name");if(!n){b++;return}
      const bc=g(r,"barcode").replace(/\s+/g,"");
      const ex=bc?S.products.find(p=>p.barcode===bc):null;
      const has=k=>m[k]>=0&&g(r,k)!=="";
      const cat=g(r,"cat");if(cat&&!S.cats.includes(cat))S.cats.push(cat);
      if(ex){
        if(mode==="skip"){s++;return}
        ex.name=n;if(cat)ex.cat=cat;
        if(has("price"))ex.price=Math.round(num(g(r,"price"))*mult);
        if(has("cost"))ex.cost=Math.round(num(g(r,"cost"))*mult);
        if(has("stock"))ex.stock=stk==="add"?ex.stock+num(g(r,"stock")):num(g(r,"stock"));
        if(has("min"))ex.min=num(g(r,"min"));
        u++;
      }else{
        const c=cat||"ផ្សេងៗ";if(!S.cats.includes(c))S.cats.push(c);
        S.products.push({id:uid()+"i"+i,barcode:bc||("P"+String(Date.now()).slice(-7)+i),name:n,cat:c,price:Math.round(num(g(r,"price"))*mult),cost:Math.round(num(g(r,"cost"))*mult),stock:has("stock")?num(g(r,"stock")):0,min:has("min")?num(g(r,"min")):5});
        a++;
      }
    });

};

let rep={p:"today",from:"",to:""};
function repRange(){const n=new Date(),t=dkey(n);
  if(rep.p==="today")return[t,t];
  if(rep.p==="yday"){const y=dkey(new Date(n.getTime()-864e5));return[y,y]}
  if(rep.p==="7")return[dkey(new Date(n.getTime()-6*864e5)),t];
  if(rep.p==="30")return[dkey(new Date(n.getTime()-29*864e5)),t];
  if(rep.p==="all")return["0000-00-00","9999-99-99"];
  const f=rep.from||t;return[f,rep.to||f]}

POS.bkCopy=function(){const e=$("#bk");e.select();try{navigator.clipboard.writeText(e.value).then(()=>{$("#bkc").textContent="បានចម្លង ✓"},()=>toast("សូមចុច Ctrl+C"))}catch(x){toast("សូមចុច Ctrl+C")}};
POS.bkRestore=function(){let d;try{d=JSON.parse($("#bk").value)}catch(e){toast("អក្សរបម្រុងមិនត្រឹមត្រូវ");return}
  if(!d||!Array.isArray(d.products)||!Array.isArray(d.sales)){toast("មិនមែនទិន្នន័យបម្រុងរបស់កម្មវិធីនេះទេ");return}
  if(!confirmed("bk"))return;S=d;cart=[];save();view="sale";shell();closeM();toast("បានស្តារទិន្នន័យ")};

/* two-tap confirmation (confirm() is blocked in artifacts) */
let pend=null,pendT=0;
function confirmed(k){if(pend===k&&Date.now()-pendT<4000){pend=null;return true}pend=k;pendT=Date.now();toast("ចុចម្តងទៀតដើម្បីបញ្ជាក់");return false}
window.POS=POS;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#ov"))closeM();
  if(view==="sale"&&!$("#ov")&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const a=document.activeElement;if(!a||!/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){const s=$("#scan");if(s)s.focus()}}
  if(e.key==="F9"&&view==="sale"&&!$("#ov")){e.preventDefault();POS.pay()}
});
shell();
setTimeout(()=>{if(!curShift()&&!$("#ov"))POS.openShift()},500);
})();
</script>
